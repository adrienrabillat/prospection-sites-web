# Réglages de l'outil de prospection. Usage : .venv/bin/python prospect.py "Clichy"

# Dépense Anthropic (en dollars). L'outil s'arrête avant de dépasser ces plafonds.
budget:
  par_ville_usd: 20        # plafond d'un lancement (modifiable avec --budget)
  total_usd: 100           # plafond cumulé, tous lancements confondus (ton crédit)

# Jugement des sites : Claude regarde les captures d'écran (ordinateur + mobile) et le texte de chaque site
ia:
  modele: claude-opus-5-5
  effort: medium                   # low | medium | high : profondeur de réflexion (et coût)
  parallele: 4                     # sites jugés en même temps
  cout_estime_usd: 0.06            # par site, avant la première mesure (ensuite : moyenne réelle)
  validite_jours: 180              # un verdict est refait au-delà
  # Tarifs en dollars par million de tokens (novembre 2026), pour compter la dépense
  prix_par_million:
    claude-opus-5-5: {entree: 4.0, sortie: 20.0}
    claude-sonnet-5-5: {entree: 2.0, sortie: 10.0}
    claude-haiku-5-5: {entree: 0.1, sortie: 0.5}

# Google Maps via SerpAPI : une recherche par métier renvoie 20 entreprises avec leur site, téléphone et avis
google_maps:
  plafond_mensuel: 240             # le plan gratuit donne 250 recherches par mois
  pages_par_metier: 1              # 2 = 40 entreprises par métier (double les recherches)

# Secours quand Google Maps n'est pas disponible (pas de clé ou quota épuisé) : Claude cherche sur le web
decouverte_ia:
  modele: claude-sonnet-5-5
  max_recherches: 4                # recherches web par métier (10 $ les 1 000)
  prix_recherche: 0.01
  cout_estime_usd: 0.15            # par métier

# Potentiel commercial : seules les entreprises au-dessus de ces deux seuils apparaissent dans le rapport
potentiel:
  interet_min: 4                   # intérêt d'un site pour ce métier, de 0 à 5
  sante_min: 3                     # santé de l'entreprise (avis Google, registre : ancienneté, effectif, comptes), de 0 à 5
  modele: claude-sonnet-5-5
  taille_lot: 20                   # entreprises notées par appel
  cout_estime_lot_usd: 0.04

# Métiers cherchés dans la ville (une recherche Google Maps chacun). Ajoute ou retire librement.
metiers:
  - plombier
  - chauffagiste
  - électricien
  - serrurier
  - menuisier
  - peintre en bâtiment
  - maçon
  - couvreur
  - carreleur
  - entreprise de rénovation
  - paysagiste
  - entreprise de nettoyage
  - déménageur
  - garage automobile
  - carrosserie
  - auto-école
  - taxi VTC
  - coiffeur
  - barbier
  - institut de beauté
  - salon de massage
  - tatoueur
  - restaurant
  - pizzeria
  - traiteur
  - boulangerie pâtisserie
  - fleuriste
  - pressing retoucherie
  - cordonnerie
  - photographe
  - ostéopathe
  - kinésithérapeute
  - psychologue
  - vétérinaire
