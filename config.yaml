# Ce qui n'est jamais visité
exclusions:
  # Réseaux sociaux, annuaires, plateformes, administrations : pas le site de l'entreprise
  domaines: [facebook.com, fb.com, fb.me, instagram.com, linktr.ee, taplink.cc, beacons.ai, bento.me, linkedin.com, tiktok.com, youtube.com, x.com,
             twitter.com, google.com, google.fr, goo.gl, business.site, pagesjaunes.fr, societe.com, pappers.fr,
             annuaire-entreprises.data.gouv.fr, doctolib.fr, planity.com, treatwell.fr, booksy.com, thefork.fr,
             lafourchette.com, tripadvisor.fr, tripadvisor.com, ubereats.com, deliveroo.fr, just-eat.fr,
             booking.com, airbnb.fr, yelp.fr, mappy.com, lesbonsartisans.fr, starofservice.com, habitatpresto.com,
             travaux.com, wikipedia.org, laposte.fr, transilien.com, ratp.fr, sncf.com, service-public.fr,
             ameli.fr, pole-emploi.fr, francetravail.fr, malt.fr, superprof.fr, resalib.fr, medoucine.com]
  # Chaînes et franchises reconnues à leur nom (en mots entiers), pour ne pas payer leur jugement
  enseignes: [afflelou, krys, "optical center", atol, "optic 2000", "grand optical", adagio, ibis, novotel, mercure,
              campanile, kyriad, "b&b hotels", "premiere classe", "appart city", "ecf", "cer", stych, ornikar,
              "point s", speedy, midas, norauto, "feu vert", carglass, "franck provost", "jean louis david",
              dessange, "saint algue", "camille albane", "tchip", "yves rocher", "body minute", sephora, "mcdonald",
              "burger king", kfc, subway, "domino's", "pizza hut", "o'tacos", "brioche doree",
              "la mie caline", "marie blachere", orpi, "century 21", laforet, "guy hoquet", "stephane plaza",
              "era immobilier", foncia, nexity, "basic fit", "fitness park", "keep cool", "l'orange bleue",
              acadomia, "complétude", "anacours", "monceau fleurs", interflora, "5 a sec", "demeco", "les gentlemen du demenagement"]
  # Fins de domaine exclues (administrations, enseignement public)
  suffixes: [.gouv.fr, .ac-versailles.fr, .ac-paris.fr, .ac-creteil.fr]
  # Lieux OpenStreetMap qui ne sont pas des clients possibles (valeurs de amenity, office, shop…)
  types_osm: [school, college, university, kindergarten, townhall, post_office, police, fire_station, library,
              place_of_worship, hospital, bank, atm, fuel, parking, bicycle_rental, charging_station,
              community_centre, social_facility, courthouse, public_building, government, bus_station,
              supermarket, convenience, car_rental, marketplace, recycling, post_box]
  # Un même domaine présent sur plus de lieux que ce nombre dans la ville = réseau, pas un indépendant
  max_lieux_par_domaine: 2

# Délai minimum entre deux requêtes vers le même service (secondes)
debit:
  geo.api.gouv.fr: 0.1
  recherche-entreprises.api.gouv.fr: 0.2
  serpapi.com: 1.0
  overpass-api.de: 5.0
  defaut: 1.0
timeout_api: 40

# Visite des sites (navigateur Chromium sans fenêtre)
visite:
  parallele: 4                     # sites ouverts en même temps
  delai_chargement_s: 30
